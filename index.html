<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drama Studio™</title>
    <meta name="theme-color" content="#16140f" />
    <link rel="icon" type="image/png" href="brand/drama-studio-mark-64.png" />
  </head>
  <body>
    <script>
      // Apply persisted theme before first paint to prevent flash
      ;(function(){try{var t=localStorage.getItem('comfystudio-theme');if(t&&t!=='high-contrast'&&t!=='velorn'&&t!=='drama-studio')document.documentElement.setAttribute('data-theme',t)}catch(e){}})()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
