name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-integrity:
    name: Verify apps and Chrome release
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify canonical Vercel configuration
        run: npm run verify:vercel-config

      - name: Test guarded Vercel release tooling
        run: npm run test:vercel-tooling

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test workspaces
        run: npm run test

      - name: Test release tooling
        run: npm run test:tooling:grok

      - name: Enforce clean-source boundary
        run: npm run verify:boundaries:grok

      - name: Scan development source
        run: npm run scan:source:grok

      - name: Scan platform API source
        run: npm run scan:source:api

      - name: Build TypeScript contracts
        run: npm run build:contracts

      - name: Verify TypeScript contracts
        run: npm run verify:build:contracts

      - name: Build platform API
        run: npm run build:api

      - name: Verify platform API build
        run: npm run verify:build:api

      - name: Build landing and auth shell
        run: npm run build:dashboard

      - name: Verify landing and auth shell
        run: npm run verify:build:dashboard

      - name: Build extension
        run: npm run build:grok

      - name: Verify unpacked production build
        run: npm run verify:build:grok && npm run scan:output:grok

      - name: Create release ZIP
        run: npm run zip:grok

      - name: Verify deterministic release ZIP
        run: npm run verify:zip:grok

      - name: Audit production and development dependencies
        run: npm run audit

      - name: Upload verified release ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grok-automator-chrome-release
          path: apps/grok-automator/.output/*-chrome.zip
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
