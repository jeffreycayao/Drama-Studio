<!--
  A trimmed, hand-made copy of the Grok Imagine page structure the adapter
  relies on (src/sites/grok.ts and src/sites/ai-sites.ts). No live content:
  the media addresses are made up and nothing here is fetched. Tests wire the
  menu behaviour themselves.
-->
<main>
  <form>
    <div data-testid="drop-ui">
      <textarea id="composer" placeholder="Type to imagine"></textarea>
      <input type="file" id="upload" accept="image/*" multiple />
    </div>
    <div class="toolbar">
      <button type="button" id="mode-video">Video</button>
      <button
        type="button"
        id="aspect"
        aria-haspopup="menu"
        aria-expanded="false"
      >
        <svg aria-hidden="true"></svg><span>2:3</span>
      </button>
      <button type="submit" id="submit" class="rounded-full">Generate</button>
    </div>
  </form>
  <div id="imagine-masonry-section-0">
    <div role="listitem">
      <img
        id="result-image"
        alt=""
        src="https://imgen.x.ai/xai-imgen/xai-tmp-imgen-fixture.jpeg"
      />
      <div class="hover-layer" id="hover-layer"></div>
    </div>
    <div role="listitem">
      <video
        id="result-video"
        src="https://vidgen.x.ai/xai-vidgen-bucket/fixture.mp4"
      ></video>
    </div>
    <div role="listitem">
      <img id="result-blob" alt="" src="blob:https://grok.com/0000" />
    </div>
    <div role="listitem">
      <img
        id="result-elsewhere"
        alt=""
        src="https://cdn.example.com/elsewhere.png"
      />
    </div>
  </div>
  <header>
    <img id="avatar" alt="" src="https://grok.com/avatar.png" />
  </header>
</main>
<template id="aspect-menu">
  <div role="menu">
    <div role="menuitemradio" aria-checked="true"><span>2:3</span></div>
    <div role="menuitemradio" aria-checked="false"><span>3:2</span></div>
    <div role="menuitemradio" aria-checked="false"><span>1:1</span></div>
    <div role="menuitemradio" aria-checked="false"><span>9:16</span></div>
    <div role="menuitemradio" aria-checked="false"><span>16:9</span></div>
  </div>
</template>
