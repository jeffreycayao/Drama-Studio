<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=https://sellify.ph/">
    <meta name="description" content="Sellify™ AI Connector - Automatically prefill AI prompts on Gemini, ChatGPT, Claude, Perplexity, and Manus. Redirecting to sellify.ph...">
    <meta name="keywords" content="Sellify AI Connector, Chrome extension, AI automation, Gemini, ChatGPT, Claude, Perplexity, Manus">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://sellify.ph/">
    <title>Sellify™ AI Connector - Redirecting...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 600px;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            animation: fadeIn 0.5s ease-in;
        }
        p {
            font-size: 1.2em;
            margin-bottom: 30px;
            opacity: 0.9;
            animation: fadeIn 0.7s ease-in;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            margin: 0 auto 30px;
            animation: spin 1s linear infinite;
        }
        .links {
            margin-top: 30px;
            animation: fadeIn 1s ease-in;
        }
        .links a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            padding: 10px 20px;
            border: 2px solid white;
            border-radius: 25px;
            display: inline-block;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }
        .links a:hover {
            background: white;
            color: #667eea;
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 40px;
            font-size: 0.9em;
            opacity: 0.7;
            animation: fadeIn 1.2s ease-in;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <script>
        // Fallback redirect in case meta refresh doesn't work
        setTimeout(function() {
            window.location.href = 'https://sellify.ph/';
        }, 100);
    </script>
</head>
<body>
    <div class="container">
        <h1>Sellify™ AI Connector</h1>
        <div class="spinner"></div>
        <p>Redirecting to sellify.ph...</p>
        <p style="font-size: 0.9em; opacity: 0.8;">If you are not redirected automatically, <a href="https://sellify.ph/" style="color: white; text-decoration: underline;">click here</a>.</p>
        
        <div class="links">
            <a href="support.html">Support</a>
            <a href="privacy.html">Privacy</a>
            <a href="terms.html">Terms</a>
        </div>
        
        <div class="footer">
            <p>Sellify™ AI Connector v2.1.0</p>
            <p>© 2026 Sellify.ph. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
