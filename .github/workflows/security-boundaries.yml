name: Security Boundaries
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  security-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm run test:security-hardening
      - run: node --test tests/llmGateway.test.cjs tests/subscriptionCli.test.cjs
      - run: npm run test:app-updater
